# Kiwi Retail Co. eval set for warehouse-qa (PRD §3.7, tasks 4.3-4.4).
#
# 150 questions: 90 regular, 40 trap, 20 clarify/abstain. Labelling rules: docs/eval.md.
# - "Now" is the end of 2026-09-30 (the dbt var as_of_date, the last day of loaded data).
# - gold_sql is executed AS `role`: analysts' gold results are already region-filtered and
#   masked. `warehouse-qa eval validate` runs every gold query that way.
# - gold_nodes lists the metric and caveats a careful analyst would consult; the tables and
#   columns the gold SQL reads are added by `warehouse-qa eval label` (derived, never by hand).
# - Written independently of demo/query_examples.yml; `eval contamination` checks the overlap.

questions:
  # ===================================================================== regular (90)
  # ---- revenue and orders
  - id: q001
    category: regular
    difficulty: easy
    role: analyst_au
    question: What was net revenue in NZD for August 2026?
    expected_mode: answer
    gold_sql: |
      select sum(net_revenue_nzd) as net_revenue_nzd
      from marts.fct_revenue_daily
      where revenue_date >= date '2026-08-01' and revenue_date < date '2026-09-01'
    gold_nodes: [metric.net_revenue]

  - id: q002
    category: regular
    difficulty: easy
    role: analyst_nz
    question: How many completed or returned orders were placed in July 2026?
    expected_mode: answer
    gold_sql: |
      select count(*) as orders
      from marts.fct_orders
      where is_revenue_order and order_date >= date '2026-07-01' and order_date < date '2026-08-01'
    gold_nodes: [metric.order_count]

  - id: q003
    category: regular
    difficulty: medium
    role: finance
    question: Give me gross revenue, refunds and net revenue in NZD for each region for calendar year 2025.
    expected_mode: answer
    gold_sql: |
      select region_code, sum(gross_revenue_nzd) as gross_revenue_nzd,
             sum(refunds_nzd) as refunds_nzd, sum(net_revenue_nzd) as net_revenue_nzd
      from marts.fct_revenue_daily
      where revenue_date >= date '2025-01-01' and revenue_date < date '2026-01-01'
      group by region_code
    gold_nodes: [metric.gross_revenue, metric.net_revenue]

  - id: q004
    category: regular
    difficulty: easy
    role: admin
    question: What was total net revenue in NZD across the whole business in Q2 2026?
    expected_mode: answer
    gold_sql: |
      select sum(net_revenue_nzd) as net_revenue_nzd
      from marts.fct_revenue_daily
      where revenue_date >= date '2026-04-01' and revenue_date < date '2026-07-01'
    gold_nodes: [metric.net_revenue]

  - id: q005
    category: regular
    difficulty: medium
    role: analyst_nz
    question: Split net revenue for the first half of 2026 between online and in-store, in NZD.
    expected_mode: answer
    gold_sql: |
      select channel, sum(net_revenue_nzd) as net_revenue_nzd
      from marts.fct_revenue_daily
      where revenue_date >= date '2026-01-01' and revenue_date < date '2026-07-01'
      group by channel
    gold_nodes: [metric.net_revenue]

  - id: q006
    category: regular
    difficulty: medium
    role: analyst_au
    question: Which month of 2025 had the highest net revenue, and how much was it?
    expected_mode: answer
    gold_sql: |
      select date_trunc('month', revenue_date)::date as month, sum(net_revenue_nzd) as net_revenue_nzd
      from marts.fct_revenue_daily
      where revenue_date >= date '2025-01-01' and revenue_date < date '2026-01-01'
      group by 1
      order by 2 desc
      limit 1
    gold_nodes: [metric.net_revenue]

  - id: q007
    category: regular
    difficulty: medium
    role: finance
    question: What was the average order value in NZD for revenue orders in each region in Q3 2026?
    expected_mode: answer
    gold_sql: |
      select region_code, avg(order_total_nzd) as avg_order_value_nzd
      from marts.fct_orders
      where is_revenue_order and order_date >= date '2026-07-01' and order_date < date '2026-10-01'
      group by region_code
    gold_nodes: [metric.average_order_value]

  - id: q008
    category: regular
    difficulty: easy
    role: analyst_au
    question: How many orders were cancelled in 2026 so far?
    expected_mode: answer
    gold_sql: |
      select count(*) as cancelled_orders
      from marts.fct_orders
      where order_status = 'cancelled' and order_date >= date '2026-01-01'

  - id: q009
    category: regular
    difficulty: easy
    role: analyst_nz
    question: How many orders are still pending?
    expected_mode: answer
    gold_sql: |
      select count(*) as pending_orders
      from marts.fct_orders
      where order_status = 'pending'

  - id: q010
    category: regular
    difficulty: medium
    role: admin
    question: For each order status, how many orders were there in 2025 and what share of all 2025 orders is that?
    expected_mode: answer
    gold_sql: |
      select order_status, count(*) as orders,
             count(*)::numeric / sum(count(*)) over () as share
      from marts.fct_orders
      where order_date >= date '2025-01-01' and order_date < date '2026-01-01'
      group by order_status

  - id: q011
    category: regular
    difficulty: medium
    role: analyst_au
    question: Which store had the most revenue orders in Q2 2026?
    expected_mode: answer
    gold_sql: |
      select s.store_name, count(*) as revenue_orders
      from marts.fct_orders o
      join marts.dim_stores s on s.store_id = o.store_id
      where o.is_revenue_order and o.order_date >= date '2026-04-01' and o.order_date < date '2026-07-01'
      group by s.store_name
      order by revenue_orders desc
      limit 1

  - id: q012
    category: regular
    difficulty: medium
    role: analyst_nz
    question: List our stores with their net revenue in NZD for 2025, highest first.
    expected_mode: answer
    gold_sql: |
      select s.store_name, sum(o.net_revenue_nzd) as net_revenue_nzd
      from marts.fct_orders o
      join marts.dim_stores s on s.store_id = o.store_id
      where o.is_revenue_order and o.order_date >= date '2025-01-01' and o.order_date < date '2026-01-01'
      group by s.store_name
      order by net_revenue_nzd desc
    gold_nodes: [metric.net_revenue]

  - id: q013
    category: regular
    difficulty: easy
    role: finance
    question: How much shipping did we charge in NZD on revenue orders in 2025?
    expected_mode: answer
    gold_sql: |
      select sum(shipping_fee * fx_rate_to_nzd) as shipping_nzd
      from marts.fct_orders
      where is_revenue_order and order_date >= date '2025-01-01' and order_date < date '2026-01-01'

  - id: q014
    category: regular
    difficulty: medium
    role: admin
    question: What share of revenue orders in 2026 used a discount code?
    expected_mode: answer
    gold_sql: |
      select avg(case when discount_code is not null then 1.0 else 0 end) as share_with_discount
      from marts.fct_orders
      where is_revenue_order and order_date >= date '2026-01-01'

  - id: q015
    category: regular
    difficulty: medium
    role: analyst_au
    question: Which discount codes have been used, and on how many revenue orders each?
    expected_mode: answer
    gold_sql: |
      select discount_code, count(*) as orders
      from marts.fct_orders
      where is_revenue_order and discount_code is not null
      group by discount_code

  - id: q016
    category: regular
    difficulty: easy
    role: analyst_nz
    question: How many units did we sell on revenue orders in September 2026?
    expected_mode: answer
    gold_sql: |
      select sum(units) as units
      from marts.fct_orders
      where is_revenue_order and order_date >= date '2026-09-01' and order_date < date '2026-10-01'

  - id: q017
    category: regular
    difficulty: hard
    role: finance
    question: Show monthly net revenue in NZD for 2026 with the month-on-month change.
    expected_mode: answer
    gold_sql: |
      select month, net_revenue_nzd,
             net_revenue_nzd - lag(net_revenue_nzd) over (order by month) as change_nzd
      from (
          select date_trunc('month', revenue_date)::date as month, sum(net_revenue_nzd) as net_revenue_nzd
          from marts.fct_revenue_daily
          where revenue_date >= date '2026-01-01'
          group by 1
      ) m
      order by month
    gold_nodes: [metric.net_revenue]

  - id: q018
    category: regular
    difficulty: hard
    role: admin
    question: How did net revenue in January to September 2026 compare with the same months of 2025, in NZD?
    expected_mode: answer
    gold_sql: |
      select extract(year from revenue_date)::int as year, sum(net_revenue_nzd) as net_revenue_nzd
      from marts.fct_revenue_daily
      where (revenue_date >= date '2025-01-01' and revenue_date < date '2025-10-01')
         or (revenue_date >= date '2026-01-01' and revenue_date < date '2026-10-01')
      group by 1
      order by 1
    gold_nodes: [metric.net_revenue]

  - id: q019
    category: regular
    difficulty: medium
    role: analyst_au
    question: On which weekday do we get the most revenue orders, counting all of 2025?
    expected_mode: answer
    gold_sql: |
      select trim(to_char(order_date, 'Day')) as weekday, count(*) as orders
      from marts.fct_orders
      where is_revenue_order and order_date >= date '2025-01-01' and order_date < date '2026-01-01'
      group by 1
      order by orders desc
      limit 1

  - id: q020
    category: regular
    difficulty: easy
    role: analyst_nz
    question: What was our gross revenue in NZD on Black Friday, 28 November 2025?
    expected_mode: answer
    gold_sql: |
      select sum(gross_revenue_nzd) as gross_revenue_nzd
      from marts.fct_revenue_daily
      where revenue_date = date '2025-11-28'
    gold_nodes: [metric.gross_revenue]

  # ---- products and items
  - id: q021
    category: regular
    difficulty: medium
    role: analyst_au
    question: Which three products sold the most units on revenue orders in 2026?
    expected_mode: answer
    gold_sql: |
      select product_name, sum(quantity) as units
      from marts.fct_order_items
      where is_revenue_order and order_date >= date '2026-01-01'
      group by product_name
      order by units desc
      limit 3

  - id: q022
    category: regular
    difficulty: medium
    role: finance
    question: What was the gross margin in NZD by product category for revenue orders in 2025?
    expected_mode: answer
    gold_sql: |
      select category, sum(line_margin_nzd) as margin_nzd
      from marts.fct_order_items
      where is_revenue_order and order_date >= date '2025-01-01' and order_date < date '2026-01-01'
      group by category

  - id: q023
    category: regular
    difficulty: easy
    role: admin
    question: How many products are in the catalogue, and how many of them are still active?
    expected_mode: answer
    gold_sql: |
      select count(*) as products, count(*) filter (where is_active) as active_products
      from marts.dim_products

  - id: q024
    category: regular
    difficulty: easy
    role: marketing
    question: Which product category has the highest average list margin percentage?
    expected_mode: answer
    gold_sql: |
      select category, avg(list_margin_pct) as avg_list_margin_pct
      from marts.dim_products
      group by category
      order by avg_list_margin_pct desc
      limit 1

  - id: q025
    category: regular
    difficulty: medium
    role: analyst_nz
    question: What were the line sales in NZD for each product category in Q3 2026, on revenue orders?
    expected_mode: answer
    gold_sql: |
      select category, sum(line_amount_nzd) as sales_nzd
      from marts.fct_order_items
      where is_revenue_order and order_date >= date '2026-07-01' and order_date < date '2026-10-01'
      group by category

  - id: q026
    category: regular
    difficulty: hard
    role: finance
    question: Which ten products earned the most gross margin in NZD over all time, and what was each one's margin as a share of its line sales?
    expected_mode: answer
    gold_sql: |
      select product_name, sum(line_margin_nzd) as margin_nzd,
             sum(line_margin_nzd) / sum(line_amount_nzd) as margin_share
      from marts.fct_order_items
      where is_revenue_order
      group by product_name
      order by margin_nzd desc
      limit 10

  - id: q027
    category: regular
    difficulty: medium
    role: admin
    question: How much discount in NZD was given on order lines in 2025, by product category?
    expected_mode: answer
    gold_sql: |
      select i.category, sum(i.discount_amount * o.fx_rate_to_nzd) as discount_nzd
      from marts.fct_order_items i
      join marts.fct_orders o on o.order_id = i.order_id
      where i.is_revenue_order and i.order_date >= date '2025-01-01' and i.order_date < date '2026-01-01'
      group by i.category

  - id: q028
    category: regular
    difficulty: easy
    role: marketing
    question: When was the most recent product launched, and what is it called?
    expected_mode: answer
    gold_sql: |
      select product_name, launched_on
      from marts.dim_products
      order by launched_on desc, product_id
      limit 1

  - id: q029
    category: regular
    difficulty: medium
    role: analyst_au
    question: What is the average number of order lines per revenue order?
    expected_mode: answer
    gold_sql: |
      select avg(line_count) as avg_lines
      from marts.fct_orders
      where is_revenue_order

  - id: q030
    category: regular
    difficulty: hard
    role: analyst_nz
    question: For each category, what share of 2025 units came from the online store?
    expected_mode: answer
    gold_sql: |
      select category,
             sum(case when channel = 'online' then quantity else 0 end)::numeric / sum(quantity) as online_share
      from marts.fct_order_items
      where is_revenue_order and order_date >= date '2025-01-01' and order_date < date '2026-01-01'
      group by category

  # ---- customers
  - id: q031
    category: regular
    difficulty: easy
    role: marketing
    question: How many customers do we have in each region?
    expected_mode: answer
    gold_sql: |
      select region_code, count(*) as customers
      from marts.dim_customers
      group by region_code

  - id: q032
    category: regular
    difficulty: easy
    role: analyst_au
    question: How many customers signed up in 2025?
    expected_mode: answer
    gold_sql: |
      select count(*) as customers
      from marts.dim_customers
      where signed_up_on >= date '2025-01-01' and signed_up_on < date '2026-01-01'

  - id: q033
    category: regular
    difficulty: medium
    role: marketing
    question: Which acquisition channel brought in the most customers who have placed at least one order?
    expected_mode: answer
    gold_sql: |
      select acquisition_channel, count(*) as customers
      from marts.dim_customers
      where lifetime_orders > 0
      group by acquisition_channel
      order by customers desc
      limit 1

  - id: q034
    category: regular
    difficulty: easy
    role: marketing
    question: What share of customers have opted in to marketing?
    expected_mode: answer
    gold_sql: |
      select avg(case when marketing_opt_in then 1.0 else 0 end) as opt_in_share
      from marts.dim_customers

  - id: q035
    category: regular
    difficulty: medium
    role: analyst_nz
    question: Which three cities have the most customers?
    expected_mode: answer
    gold_sql: |
      select city, count(*) as customers
      from marts.dim_customers
      group by city
      order by customers desc
      limit 3

  - id: q036
    category: regular
    difficulty: medium
    role: finance
    question: What is the average net lifetime value in NZD for each customer segment, counting only customers with at least one revenue order?
    expected_mode: answer
    gold_sql: |
      select customer_segment, avg(net_ltv_nzd) as avg_net_ltv_nzd
      from marts.rpt_customer_ltv
      where revenue_orders > 0
      group by customer_segment

  - id: q037
    category: regular
    difficulty: hard
    role: analyst_au
    question: Who are our ten customers with the highest net lifetime value? Show their email and net LTV in NZD.
    expected_mode: answer
    gold_sql: |
      select c.email, l.net_ltv_nzd
      from marts.rpt_customer_ltv l
      join marts.dim_customers c on c.customer_id = l.customer_id
      order by l.net_ltv_nzd desc, l.customer_id
      limit 10
    notes: Emails are masked for analysts; the gold result is the masked values, which is the correct answer for this role.

  - id: q038
    category: regular
    difficulty: medium
    role: marketing
    question: How many customers have never placed an order?
    expected_mode: answer
    gold_sql: |
      select count(*) as customers
      from marts.dim_customers
      where lifetime_orders = 0

  - id: q039
    category: regular
    difficulty: medium
    role: admin
    question: What is the median number of lifetime orders among customers who have ordered at least once?
    expected_mode: answer
    gold_sql: |
      select percentile_cont(0.5) within group (order by lifetime_orders) as median_orders
      from marts.dim_customers
      where lifetime_orders > 0

  - id: q040
    category: regular
    difficulty: hard
    role: analyst_nz
    question: For customers who signed up in 2024, how many placed their first order within 30 days of signing up?
    expected_mode: answer
    gold_sql: |
      select count(*) as customers
      from marts.dim_customers
      where signed_up_on >= date '2024-01-01' and signed_up_on < date '2025-01-01'
        and first_order_date is not null and first_order_date - signed_up_on <= 30

  - id: q041
    category: regular
    difficulty: medium
    role: finance
    question: What is the canonical churn rate as of 2026-09-30, split by region?
    expected_mode: answer
    gold_sql: |
      select region_code, avg(case when is_churned then 1.0 else 0 end) as churn_rate
      from marts.rpt_customer_churn
      where has_ordered
      group by region_code
    gold_nodes: [metric.churn_rate, caveat.cav_two_churn_definitions]

  - id: q042
    category: regular
    difficulty: medium
    role: marketing
    question: Using marketing's 180-day churn definition, what share of all customers count as churned?
    expected_mode: answer
    gold_sql: |
      select avg(case when is_churned_marketing then 1.0 else 0 end) as churn_rate_marketing
      from marts.rpt_customer_churn
    gold_nodes: [metric.churn_rate_marketing, caveat.cav_two_churn_definitions]
    notes: Explicitly asks for marketing's definition, so using it is correct (not the T5 trap).

  - id: q043
    category: regular
    difficulty: easy
    role: analyst_au
    question: How many of our customers are VIPs?
    expected_mode: answer
    gold_sql: |
      select count(*) as vip_customers
      from marts.dim_customers
      where customer_segment = 'VIP'

  - id: q044
    category: regular
    difficulty: hard
    role: admin
    question: What share of customers with at least one order have ordered from both a store and online?
    expected_mode: answer
    gold_sql: |
      select avg(case when n_channels = 2 then 1.0 else 0 end) as share_both
      from (
          select customer_id, count(distinct channel) as n_channels
          from marts.fct_orders
          where is_revenue_order
          group by customer_id
      ) c

  - id: q045
    category: regular
    difficulty: medium
    role: analyst_nz
    question: What is the average gross lifetime value in NZD of customers who came through search and have placed at least one order?
    expected_mode: answer
    gold_sql: |
      select avg(lifetime_gross_nzd) as avg_gross_ltv_nzd
      from marts.dim_customers
      where acquisition_channel = 'search' and lifetime_orders > 0

  # ---- payments and refunds
  - id: q046
    category: regular
    difficulty: easy
    role: finance
    question: How many successful payments were made with each payment method in 2025?
    expected_mode: answer
    gold_sql: |
      select payment_method, count(*) as payments
      from marts.fct_payments
      where payment_status = 'success' and paid_date >= date '2025-01-01' and paid_date < date '2026-01-01'
      group by payment_method

  - id: q047
    category: regular
    difficulty: medium
    role: analyst_au
    question: What share of payment attempts failed in 2026?
    expected_mode: answer
    gold_sql: |
      select avg(case when payment_status = 'failed' then 1.0 else 0 end) as failed_share
      from marts.fct_payments
      where paid_date >= date '2026-01-01'

  - id: q048
    category: regular
    difficulty: medium
    role: admin
    question: How much was collected in NZD through Afterpay in Q3 2026?
    expected_mode: answer
    gold_sql: |
      select sum(amount_nzd) as afterpay_nzd
      from marts.fct_payments
      where payment_method = 'afterpay' and payment_status = 'success'
        and paid_date >= date '2026-07-01' and paid_date < date '2026-10-01'

  - id: q049
    category: regular
    difficulty: easy
    role: finance
    question: Which refund reason cost us the most in NZD in 2026, and what share of 2026 refunds was it?
    expected_mode: answer
    gold_sql: |
      select refund_reason, sum(refund_amount_nzd) as refunds_nzd,
             sum(refund_amount_nzd) / sum(sum(refund_amount_nzd)) over () as share
      from marts.fct_refunds
      where refund_date >= date '2026-01-01'
      group by refund_reason
      order by refunds_nzd desc
      limit 1

  - id: q050
    category: regular
    difficulty: medium
    role: analyst_nz
    question: How many refunds did we process in Q2 2026, and how much were they worth in NZD?
    expected_mode: answer
    gold_sql: |
      select count(*) as refunds, sum(refund_amount_nzd) as refunds_nzd
      from marts.fct_refunds
      where refund_date >= date '2026-04-01' and refund_date < date '2026-07-01'

  - id: q051
    category: regular
    difficulty: hard
    role: finance
    question: What was the refund rate in 2025, as refunds in NZD divided by gross revenue in NZD, for each region?
    expected_mode: answer
    gold_sql: |
      select region_code, sum(refunds_nzd) / sum(gross_revenue_nzd) as refund_rate
      from marts.fct_revenue_daily
      where revenue_date >= date '2025-01-01' and revenue_date < date '2026-01-01'
      group by region_code

  - id: q052
    category: regular
    difficulty: medium
    role: analyst_au
    question: What is the average number of days between an order and its refund?
    expected_mode: answer
    gold_sql: |
      select avg(refund_date - order_date) as avg_days
      from marts.fct_refunds

  - id: q053
    category: regular
    difficulty: easy
    role: admin
    question: How many orders were paid with more than one payment method?
    expected_mode: answer
    gold_sql: |
      select count(*) as split_tender_orders
      from marts.fct_orders
      where is_split_tender

  - id: q054
    category: regular
    difficulty: medium
    role: analyst_nz
    question: How many orders had at least one failed payment attempt in Q1 2026?
    expected_mode: answer
    gold_sql: |
      select count(*) as orders
      from marts.fct_orders
      where failed_payment_attempts > 0 and order_date >= date '2026-01-01' and order_date < date '2026-04-01'

  # ---- marketing (campaign facts that don't read ad spend)
  - id: q055
    category: regular
    difficulty: easy
    role: marketing
    question: How many campaigns have we run on each channel?
    expected_mode: answer
    gold_sql: |
      select campaign_channel, count(*) as campaigns
      from marts.dim_campaigns
      group by campaign_channel

  - id: q056
    category: regular
    difficulty: medium
    role: marketing
    question: What was the total planned campaign budget in NZD for campaigns that started in 2025?
    expected_mode: answer
    gold_sql: |
      select sum(budget_nzd) as budget_nzd
      from marts.dim_campaigns
      where started_on >= date '2025-01-01' and started_on < date '2026-01-01'

  - id: q057
    category: regular
    difficulty: medium
    role: analyst_au
    question: Which of our campaigns ran the longest, from start to end date?
    expected_mode: answer
    gold_sql: |
      select campaign_name, ended_on - started_on as days
      from marts.dim_campaigns
      order by days desc, campaign_id
      limit 1

  - id: q058
