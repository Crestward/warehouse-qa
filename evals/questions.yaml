  # ---- T7 fan-out bait: several payment rows per order
  - id: q113
    category: trap
    trap_type: fanout_join
    difficulty: hard
    role: finance
    question: What was the total value in NZD of 2025 revenue orders that were paid at least partly by card?
    expected_mode: answer
    gold_sql: |
      select sum(o.order_total_nzd) as order_value_nzd
      from marts.fct_orders o
      where o.is_revenue_order and o.order_date >= date '2025-01-01' and o.order_date < date '2026-01-01'
        and exists (
            select 1 from marts.fct_payments p
            where p.order_id = o.order_id and p.payment_method = 'card' and p.payment_status = 'success'
        )
    gold_nodes: [caveat.cav_payments_multiple_rows]
    notes: Joining orders to payments and summing order totals double-counts split tenders and failed attempts.

  - id: q114
    category: trap
    trap_type: fanout_join
    difficulty: hard
    role: admin
    question: How much money in NZD did we collect through each payment method on 2026 revenue orders?
    expected_mode: answer
    gold_sql: |
      select p.payment_method, sum(p.amount_nzd) as collected_nzd
      from marts.fct_payments p
      join marts.fct_orders o on o.order_id = p.order_id
      where p.payment_status = 'success' and o.is_revenue_order and o.order_date >= date '2026-01-01'
      group by p.payment_method
    gold_nodes: [caveat.cav_payments_multiple_rows]

