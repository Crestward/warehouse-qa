    expected_mode: answer
    gold_sql: |
      select avg(case when o.order_date > c.first_order_date then 1.0 else 0 end) as repeat_share
      from marts.fct_orders o
      join marts.dim_customers c on c.customer_id = o.customer_id
      where o.is_revenue_order and o.order_date >= date '2025-01-01' and o.order_date < date '2026-01-01'

  - id: q075
    category: regular
    difficulty: hard
    role: admin
    question: Which product category had the highest refund amount in NZD in 2025, counting refunds against orders containing that category?
    expected_mode: answer
    gold_sql: |
      select i.category, sum(distinct_refunds.refund_amount_nzd) as refunds_nzd
      from (select distinct order_id, category from marts.fct_order_items) i
      join (
          select order_id, sum(refund_amount_nzd) as refund_amount_nzd
          from marts.fct_refunds
          where refund_date >= date '2025-01-01' and refund_date < date '2026-01-01'
          group by order_id
      ) distinct_refunds on distinct_refunds.order_id = i.order_id
      group by i.category
      order by refunds_nzd desc
      limit 1
    notes: A refund counts once per category present on its order.

