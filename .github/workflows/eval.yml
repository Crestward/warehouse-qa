# The PR eval gate (docs/eval.md §9): 20 dev questions on the real model, only on PRs labelled
# `eval`. No schedule, no pushes. The response cache is kept between runs, so prompts that didn't
# change cost $0 (a full run is about US$0.10). Needs the ANTHROPIC_API_KEY repository secret.
name: eval

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval-gate:
    # Forks get no secrets, so they never run this.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'eval') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      WAREHOUSE_GRAPH_DIR: ${{ github.workspace }}/warehouse-graph
      LLM_BUDGET_USD: "1"   # per run: the runner's ledger starts empty
    steps:
      - name: Check the key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret to use the eval gate."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Pinned warehouse-graph commit
        id: pin
        run: |
          python3 -c "import tomllib; s = tomllib.load(open('pyproject.toml', 'rb'))['tool']['uv']['sources']['warehouse-graph']; print('rev=' + (s.get('rev') or s['tag']))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Crestward/warehouse-graph
          ref: ${{ steps.pin.outputs.rev }}
          path: warehouse-graph
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Eval warehouse (ad_spend stale, graph, policies)
        working-directory: warehouse-graph
        run: |
          uv sync --locked
          uv run warehouse-graph demo-data --stale ad_spend
          uv run warehouse-graph demo-build
          uv run warehouse-graph build
          uv run warehouse-graph policies
      - run: uv sync --locked
      - name: LLM response cache
        uses: actions/cache@v4
        with:
          path: .llm-cache
          key: llm-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            llm-${{ github.event.pull_request.number }}-
            llm-
      - name: Run the ci split
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run warehouse-qa eval run --config configs/config4.yaml --split ci
      - name: Gate
        run: uv run warehouse-qa eval gate "$(ls -d results/*-config4-ci | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
